# =============================================================================
# NiyuktiAI — one origin for the whole product.
#
# A complete nginx configuration, not a fragment: nginx is started with it
# directly.
#
#   C:\nginx\nginx.exe -p C:\nginx -c conf\niyuktiai.conf          (start)
#   C:\nginx\nginx.exe -p C:\nginx -c conf\niyuktiai.conf -t       (check)
#   C:\nginx\nginx.exe -p C:\nginx -c conf\niyuktiai.conf -s reload
#
# The site is static files; the two services sit behind it on the same origin,
# so the pages call /v1/... and /runner/... with no CORS, no API base to
# configure per environment, and no key in the page.
# =============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  logs/niyuktiai.access.log  main;
    error_log   logs/niyuktiai.error.log   warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # The runner streams the portal over a WebSocket; this is what lets nginx
    # pass the upgrade through instead of answering it itself.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      80;
        server_name localhost nirmanadrashta.in www.nirmanadrashta.in;

        root  C:/Users/chand/Downloads/niyuktiai/niyuktiai/web;
        index index.html;

        charset utf-8;
        client_max_body_size 25m;      # a scanned certificate can be large

        # /jobs and /jobs.html are the same page; the extension is an
        # implementation detail nobody should have to type.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # The stylesheets and the sprite have no fingerprint in their names, so
        # a cached copy would outlive a redeploy. `no-cache` still lets the
        # browser keep them — it just has to ask first, and the answer is a
        # 304 until something actually changes.
        location /assets/ {
            add_header Cache-Control "no-cache";
        }

        # --- The document service (FastAPI) ----------------------------------
        location /v1/ {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;       # extraction and Claude are not fast
            proxy_buffering    off;        # the chat replies token by token
        }

        # --- The runner (Node + Playwright) ----------------------------------
        # /runner/v1/... on the outside is /v1/... on the inside.
        location /runner/ {
            proxy_pass         http://127.0.0.1:8766/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;      # a live session outlasts any default
            proxy_send_timeout 3600s;
            proxy_buffering    off;        # frames must not queue up
        }

        location = /favicon.ico {
            return 302 /assets/img/favicon.svg;
        }
    }
}
